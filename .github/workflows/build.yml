name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test game rules
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk arise-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arise-v1.0.${{ github.run_number }}
          path: arise-v1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Arise v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download the APK below and open it on your phone to install or update.
          files: arise-v1.0.${{ github.run_number }}.apk
          make_latest: true
